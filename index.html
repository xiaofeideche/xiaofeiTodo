<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡晓飞待办</title>
  <style>
    body {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      background: skyblue;
      color: #0f2d53;
    }

    .app {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    li span {
      flex: 1;
    }

    li.completed span {
      text-decoration: line-through;
      color: #999;
    }

    li.completed .due {
      text-decoration: none;
    }

    input[type="date"] {
      padding: 10px 12px;
      font-size: 16px;
    }

    li .due {
      flex: none;
      font-size: 14px;
      color: #888;
    }

    li .due.overdue {
      color: #d92c2c;
    }

    .carousel {
      position: relative;
      margin-top: 24px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
    }

    .carousel-track img {
      width: 100%;
      flex: none;
      display: block;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.35);
      color: white;
      border: none;
      font-size: 26px;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 50%;
    }

    .carousel-btn:hover {
      background: rgba(0, 0, 0, 0.55);
    }

    .carousel-btn.prev {
      left: 12px;
    }

    .carousel-btn.next {
      right: 12px;
    }

    .carousel-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .carousel-dots .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .carousel-dots .dot.active {
      background: white;
    }

    .urgent-panel {
      position: fixed;
      top: 50px;
      left: 20px;
      width: 260px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      z-index: 10;
    }

    .urgent-panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 16px;
      color: #fff;
      background: #d92c2c;
    }

    .urgent-box {
      height: 200px;
      overflow: hidden;
    }

    .urgent-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .urgent-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .urgent-list li:nth-child(odd) {
      background: #fdeeee;
    }

    .urgent-list li:nth-child(even) {
      background: #ffffff;
    }

    .urgent-due {
      flex: none;
      font-size: 13px;
      color: #d92c2c;
      background: #fff3f3;
      padding: 2px 6px;
      border-radius: 4px;
    }

    @keyframes urgent-scroll {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="urgent-panel">
    <h2>紧急事项</h2>
    <div class="urgent-box" id="urgentBox">
      <ul class="urgent-list" id="urgentList"></ul>
    </div>
  </div>

  <div class="app">
    <h1>胡晓飞待办</h1>

    <div class="input-row">
      <input id="todoInput" type="text" placeholder="输入一个待办事项">
      <input id="dueInput" type="date">
      <button id="addButton">添加</button>
      <button id="sortButton">排序</button>
      <button id="completeAllButton">全部完成</button>
      <button id="clearCompletedButton">清空已完成</button>
      <button id="exportButton">导出</button>
    </div>

    <ul id="todoList"></ul>
    <p id="stats"></p>

    <div class="carousel">
      <div class="carousel-track" id="carouselTrack">
        <img src="images/banner01.jpg" alt="轮播图 1">
        <img src="images/banner02.jpg" alt="轮播图 2">
        <img src="images/banner03.jpg" alt="轮播图 3">
        <img src="images/banner04.jpg" alt="轮播图 4">
        <img src="images/banner05.jpg" alt="轮播图 5">
      </div>
      <button class="carousel-btn prev" id="prevButton">‹</button>
      <button class="carousel-btn next" id="nextButton">›</button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
  </div>

  <script>
    const todoInput = document.getElementById("todoInput");
    const addButton = document.getElementById("addButton");
    const todoList = document.getElementById("todoList");
    const sortButton = document.getElementById("sortButton");
    const stats = document.getElementById("stats");

    const dueInput = document.getElementById("dueInput");
    const completeAllButton = document.getElementById("completeAllButton");
    const clearCompletedButton = document.getElementById("clearCompletedButton");
    const exportButton = document.getElementById("exportButton");

    const STORAGE_KEY = "markTodo.todos";

    const defaultTodos = [
      { text: "关注「马克的技术工作坊」", completed: false },
      { text: "给这期 Git 教程点赞", completed: true }
    ];

    function loadTodos() {
      const raw = localStorage.getItem(STORAGE_KEY);

      if (raw) {
        return JSON.parse(raw);
      }

      return defaultTodos.map(todo => ({ ...todo }));
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    const todos = loadTodos();

    function isOverdue(todo) {
      if (!todo.due || todo.completed) {
        return false;
      }

      const today = new Date().toISOString().slice(0, 10);
      return todo.due < today;
    }

    function clearCompleted() {
      const remaining = todos.filter(todo => !todo.completed);

      todos.length = 0;
      todos.push(...remaining);

      saveTodos();
      renderTodos();
    }

    function exportTodos() {
      const lines = todos.map(todo => todo.text);

      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "马克待办.txt";
      link.click();
    }

    function completeAll() {
      todos.forEach(todo => {
        todo.completed = true;
      });

      saveTodos();
      renderTodos();
    }

    function renderTodos() {
      completeAllButton.disabled = todos.every(todo => todo.completed);
      todoList.innerHTML = "";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");

        if (todo.completed) {
          li.classList.add("completed");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;

        checkbox.addEventListener("change", () => {
          todos[index].completed = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const due = document.createElement("span");
        due.className = "due";
        due.textContent = todo.due ? todo.due : "";
        if (isOverdue(todo)) {
          due.classList.add("overdue");
          due.textContent = todo.due + " 已过期";
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "删除";

        deleteButton.addEventListener("click", () => {
          todos.splice(index, 1);
          saveTodos();
          renderTodos();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(due);
        li.appendChild(deleteButton);

        todoList.appendChild(li);
      });

      const left = todos.filter(todo => !todo.completed).length;
      stats.textContent = `共 ${todos.length} 项，还剩 ${left} 项没完成`;

      renderUrgent();
    }

    let sortAsc = true;

    function sortByDue() {
      todos.sort((a, b) => {
        if (!a.due) {
          return 1;
        }

        if (!b.due) {
          return -1;
        }

        return (a.due < b.due) === sortAsc ? -1 : 1;
      });

      sortButton.textContent = sortAsc ? "排序 ↑" : "排序 ↓";
      sortAsc = !sortAsc;

      saveTodos();
      renderTodos();
    }

    function addTodo() {
      const text = todoInput.value.trim();

      if (!text) {
        return;
      }

      todos.push({
        text,
        completed: false,
        due: dueInput.value
      });

      dueInput.value = "";
      todoInput.value = "";
      saveTodos();
      renderTodos();
    }

    addButton.addEventListener("click", addTodo);
    sortButton.addEventListener("click", sortByDue);

    completeAllButton.addEventListener("click", completeAll);
    clearCompletedButton.addEventListener("click", clearCompleted);
    exportButton.addEventListener("click", exportTodos);
    todoInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    renderTodos();

    /* 紧急事项列表 */
    function getUrgentItems() {
      const pending = todos.filter(todo => !todo.completed && todo.due);

      if (pending.length === 0) {
        return [];
      }

      const now = Date.now();
      const DAY_MS = 24 * 60 * 60 * 1000;

      return pending
        .map(todo => {
          const dueEnd = new Date(todo.due + "T23:59:59").getTime();
          const diff = Math.abs(dueEnd - now);
          return { todo, diff };
        })
        .filter(item => item.diff <= DAY_MS)
        .sort((a, b) => a.diff - b.diff)
        .map(item => ({ text: item.todo.text, due: item.todo.due }));
    }

    function renderUrgent() {
      const list = document.getElementById("urgentList");
      const box = document.getElementById("urgentBox");

      list.style.animation = "none";
      list.innerHTML = "";

      const items = getUrgentItems();

      if (items.length === 0) {
        const empty = document.createElement("li");
        empty.textContent = "暂无紧急事项";
        empty.style.justifyContent = "center";
        empty.style.color = "#999";
        list.appendChild(empty);
        return;
      }

      function buildSet() {
        const fragment = document.createDocumentFragment();

        items.forEach(item => {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = item.text;

          const due = document.createElement("span");
          due.className = "urgent-due";
          due.textContent = item.due;

          li.appendChild(text);
          li.appendChild(due);
          fragment.appendChild(li);
        });

        return fragment;
      }

      list.appendChild(buildSet());

      const setHeight = list.scrollHeight;
      const boxHeight = box.clientHeight;

      let copiesPerHalf = 1;
      if (setHeight > 0 && boxHeight > 0) {
        copiesPerHalf = Math.ceil(boxHeight / setHeight);
      }
      copiesPerHalf = Math.max(1, copiesPerHalf);

      if ((copiesPerHalf * items.length) % 2 !== 0) {
        copiesPerHalf += 1;
      }

      for (let i = 1; i < copiesPerHalf; i++) {
        list.appendChild(buildSet());
      }

      for (let i = 0; i < copiesPerHalf; i++) {
        list.appendChild(buildSet());
      }

      const halfCount = copiesPerHalf * items.length;
      const duration = Math.max(6, halfCount * 1.5);

      void list.offsetWidth;
      list.style.animation = `urgent-scroll ${duration}s linear infinite`;
    }

    /* 轮播模块 */
    const track = document.getElementById("carouselTrack");
    const slides = track.querySelectorAll("img");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const dotsContainer = document.getElementById("carouselDots");

    let currentIndex = 0;
    let autoTimer = null;

    for (let i = 0; i < slides.length; i++) {
      const dot = document.createElement("span");
      dot.className = "dot";
      if (i === 0) {
        dot.classList.add("active");
      }
      dot.addEventListener("click", () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }

    const dots = dotsContainer.querySelectorAll(".dot");

    function updateSlide() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === currentIndex);
      });
    }

    function goToSlide(index) {
      currentIndex = (index + slides.length) % slides.length;
      updateSlide();
      restartAutoPlay();
    }

    function nextSlide() {
      goToSlide(currentIndex + 1);
    }

    function prevSlide() {
      goToSlide(currentIndex - 1);
    }

    function restartAutoPlay() {
      clearInterval(autoTimer);
      autoTimer = setInterval(nextSlide, 4000);
    }

    nextButton.addEventListener("click", nextSlide);
    prevButton.addEventListener("click", prevSlide);
    restartAutoPlay();
  </script>
</body>
</html>
